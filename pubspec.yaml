name: smartchefai
description: "SmartChef AI - Personalized recipe recommender with AI-powered ingredient detection."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.3.4
  firebase_storage: ^12.4.0
  google_sign_in: ^6.2.1

  # HTTP and API (TheMealDB fallback)
  http: ^1.1.0
  dio: ^5.3.0

  # State Management
  provider: ^6.0.0

  # Local Storage
  shared_preferences: ^2.2.0

  # UI Components
  cupertino_icons: ^1.0.2
  cached_network_image: ^3.3.0

  # Image & Camera
  image_picker: ^1.0.0
  permission_handler: ^11.4.0

  # Speech Recognition (on-device)
  speech_to_text: ^7.3.0

  # Navigation
  go_router: ^10.0.0

  # Fonts
  google_fonts: ^6.2.1

  # Utils
  share_plus: ^7.2.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - data/
